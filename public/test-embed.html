<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareSlides Embed Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    .test-section {
      background: white;
      padding: 2rem;
      margin: 2rem 0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #555;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>ShareSlides Embed Test Page</h1>
  <p>Testing different embed sizes and formats from ShareSlides</p>

  <div class="test-section">
    <h2>Responsive Embed (16:9 ratio)</h2>
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
      <iframe src="http://localhost:4321/embed/agent-365-vs-openai-frontier" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen title="Embedded presentation"></iframe>
    </div>
  </div>

  <div class="test-section">
    <h2>Fixed Size Embed (720p)</h2>
    <iframe src="http://localhost:4321/embed/agent-365-vs-openai-frontier" width="1280" height="720" style="border: 0; max-width: 100%;" allowfullscreen title="Embedded presentation"></iframe>
  </div>

  <div class="test-section">
    <h2>Embed with Specific Page</h2>
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
      <iframe src="http://localhost:4321/embed/agent-365-vs-openai-frontier?page=5" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen title="Embedded presentation"></iframe>
    </div>
  </div>

  <div class="test-section">
    <h2>Embed without Footer</h2>
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
      <iframe src="http://localhost:4321/embed/agent-365-vs-openai-frontier?hideFooter=true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen title="Embedded presentation"></iframe>
    </div>
  </div>
</body>
</html>
